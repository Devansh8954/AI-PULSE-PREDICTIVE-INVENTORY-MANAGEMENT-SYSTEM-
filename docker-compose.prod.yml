# =============================================================================
# AI-Pulse — docker-compose.prod.yml
#
# Production mode: pulls pre-built images from Docker Hub instead of
# building locally. Use this on a server / VPS / cloud VM.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#
# Or set DOCKERHUB_USERNAME in your environment:
#   export DOCKERHUB_USERNAME="yourusername" (bash/Linux)
# =============================================================================

services:

  backend:
    # Override image to pull from Docker Hub (--no-build skips local build)
    image: ${DOCKERHUB_USERNAME}/ai-pulse-backend:latest

  frontend:
    image: ${DOCKERHUB_USERNAME}/ai-pulse-frontend:latest
