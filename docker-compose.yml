# =============================================================================
# AI-Pulse — docker-compose.yml  (single file for dev + production)
#
# Services:
#   db       → MySQL 8.4 (persisted volume, health-checked)
#   backend  → Node.js Express API (waits for db to be healthy)
#   frontend → Angular app served by Nginx (proxies /api → backend)
#
# Local dev:
#   docker compose up --build -d
#
# Production (images from Docker Hub):
#   DOCKERHUB_USERNAME=myuser docker compose up -d --no-build
# =============================================================================

services:

  # ── MySQL Database ───────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: ai_pulse_db
    restart: unless-stopped

    env_file:
      - ./backend/.env

    # No ports exposed — DB is internal only. Access via Docker network.
    # For local dev with a DB GUI, use docker-compose.override.yml to add 3306:3306.

    volumes:
      # Persist data across container restarts
      - db_data:/var/lib/mysql
      # Auto-run schema + seed on first boot (alphabetical order)
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      # Use shell form so ${DB_PASSWORD} is expanded by the shell inside the container.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    networks:
      - ai_pulse_net

  # ── Node.js Backend API ──────────────────────────────────────────────────────
  backend:
    # In production DOCKERHUB_USERNAME is set → pulls pre-built image from Docker Hub.
    # Locally (no DOCKERHUB_USERNAME) it falls back to building from source.
    image: ${DOCKERHUB_USERNAME:-local}/ai-pulse-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_pulse_backend
    restart: unless-stopped

    # Pass every env var from backend/.env into the container at runtime.
    # Secrets NEVER baked into the image.
    env_file:
      - ./backend/.env

    environment:
      # Override only the DB_HOST to point to the compose service name
      DB_HOST: db
      DB_PORT: 3306
      NODE_ENV: ${NODE_ENV:-production}

    # Port 3000 is NOT published to the host in production.
    # All traffic goes through Nginx (ports 80/443) which proxies /api/* → backend:3000.
    # For local dev, use docker-compose.override.yml to add "3000:3000".
    # ports:
    #   - "3000:3000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      # The health endpoint is registered at /health in app.js (not /api/v1/health)
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - ai_pulse_net

  # ── Angular Frontend (Nginx) ─────────────────────────────────────────────────
  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/ai-pulse-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_pulse_frontend
    restart: unless-stopped

    ports:
      - "80:80"   # Serve on standard HTTP port (redirects to HTTPS)
      - "443:443" # Serve on standard HTTPS port

    volumes:
      # Persist Let's Encrypt certs across container restarts and CI/CD redeploys.
      # This prevents hitting the rate limit (5 certs/week) on every redeploy.
      - letsencrypt_certs:/etc/letsencrypt

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - ai_pulse_net

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  db_data:
    driver: local
  letsencrypt_certs:
    driver: local   # Cert persists here — survives redeploys, prevents rate-limit exhaustion

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  ai_pulse_net:
    driver: bridge
