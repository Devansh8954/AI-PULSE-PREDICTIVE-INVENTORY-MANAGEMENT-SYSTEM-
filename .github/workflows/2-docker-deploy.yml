# =============================================================================
# 2-docker-deploy.yml
# PURPOSE : Build Docker images → Push to Docker Hub → Deploy to AWS EC2
#
# TRIGGER LOGIC (production-safe):
#   1. workflow_run  → fires ONLY after "CI — Lint & Tests" succeeds on main.
#                      This gates ALL code-change deploys behind passing tests.
#   2. push (infra)  → fires directly for Docker/infra-only changes that don't
#                      affect application code (Dockerfile, nginx.conf, etc.)
#                      These don't need a test gate.
#   3. workflow_dispatch → manual emergency deploy, always allowed.
#
# DOES NOT: run any tests (tests already ran in 1-ci-tests.yml)
# =============================================================================

name: 🐳 Docker Build & Deploy

on:
  # ── Gated code-change deploy ─────────────────────────────────────────────────
  # Only fires when CI tests PASS on main. Broken code is never deployed.
  workflow_run:
    workflows: ["🧪 CI — Lint & Tests"]
    types: [completed]
    branches: [main]

  # ── Direct infra-change deploy ───────────────────────────────────────────────
  # Docker/infra config changes don't trigger CI tests, so deploy directly.
  push:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - 'backend/.dockerignore'
      - 'frontend/Dockerfile'
      - 'frontend/.dockerignore'
      - 'frontend/nginx.conf'
      - 'frontend/entrypoint.sh'
      - 'docker-compose*.yml'
      - 'database/**'

  # ── Manual emergency deploy ───────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual deploy'

# Never cancel an in-progress deploy — risk of leaving EC2 in a broken state.
concurrency:
  group: docker-deploy-main
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — Build & Push Docker Images to Docker Hub
  # ════════════════════════════════════════════════════════════════════════════
  docker-build-push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest

    # GATE: If triggered by workflow_run, only proceed if CI tests PASSED.
    # Direct push (infra changes) and manual dispatch always proceed.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      # Checkout the exact commit that triggered the deploy.
      # For workflow_run, use the SHA that passed CI tests, not the runner SHA.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Resolve the correct commit SHA for image tagging
      - name: Resolve commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-pulse-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-pulse-backend:${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-pulse-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-pulse-frontend:${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Images summary
        run: |
          echo "## 🐳 Docker Images Pushed" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| ai-pulse-backend  | \`latest\`, \`${{ steps.sha.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ai-pulse-frontend | \`latest\`, \`${{ steps.sha.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — Deploy to AWS EC2
  # Runs after images are successfully pushed to Docker Hub
  # ════════════════════════════════════════════════════════════════════════════
  deploy-ec2:
    name: 🚀 Deploy — AWS EC2
    runs-on: ubuntu-latest
    needs: docker-build-push

    environment:
      name: production
      url: https://ai-pulse-inventory.duckdns.org

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            # Exit immediately if a command exits with a non-zero status
            set -e

            REPO_DIR="/home/${{ secrets.EC2_USERNAME }}/AI-PULSE-PREDICTIVE-INVENTORY-MANAGEMENT-SYSTEM-"
            
            echo "📦 Pulling latest images from Docker Hub..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ai-pulse-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ai-pulse-frontend:latest

            if [ ! -d "$REPO_DIR" ]; then
              echo "🔄 Cloning repo for the first time..."
              git clone https://github.com/Devansh8954/AI-PULSE-PREDICTIVE-INVENTORY-MANAGEMENT-SYSTEM-.git "$REPO_DIR"
              cd "$REPO_DIR"
            else
              echo "🔄 Syncing repo to latest main..."
              cd "$REPO_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            echo "🔑 Notice: backend/.env is managed manually on the EC2 server."
            # We no longer overwrite backend/.env from GitHub Secrets because it was breaking the deployment.

            echo "⏹️ Stopping existing stack..."
            cd "$REPO_DIR"
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
              docker compose -f docker-compose.yml \
              down --remove-orphans || true

            echo "🚀 Starting fresh stack with new images..."
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
              docker compose -f docker-compose.yml \
              up -d --remove-orphans --no-build --force-recreate || {
                echo "❌ Stack failed to start! Dumping logs for debugging:"
                echo "--- DOCKER PS ---"
                docker ps -a
                echo "--- BACKEND INSPECT ---"
                docker inspect ai_pulse_backend || true
                echo "--- BACKEND LOGS ---"
                docker logs ai_pulse_backend 2>&1 || true
                echo "--- DB LOGS ---"
                docker logs ai_pulse_db 2>&1 | tail -20 || true
                exit 1
              }

            echo "🧹 Pruning dangling images..."
            docker image prune -f

            echo "✅ Health check (waiting 25s for containers to stabilise)..."
            sleep 25
            curl -sf http://localhost:3000/health && echo "✅ Backend healthy!" || {
              echo "⚠️ Health check failed — dumping backend logs:"
              docker logs ai_pulse_backend 2>&1 | tail -30 || true
            }

            echo "📋 Container status:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      - name: Deployment summary
        run: |
          SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${SHA:0:7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor  | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ github.event.inputs.reason || 'Automated deploy' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Live URL | https://ai-pulse-inventory.duckdns.org |" >> $GITHUB_STEP_SUMMARY
