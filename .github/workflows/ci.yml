name: AI-Pulse CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

# ─────────────────────────────────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — Backend: Lint
  # ════════════════════════════════════════════════════════════════════════════
  backend-lint:
    name: 🔍 Backend — ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run ESLint
        run: npm run lint

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — Backend: Unit Tests + Coverage Gate
  # ════════════════════════════════════════════════════════════════════════════
  backend-test:
    name: 🧪 Backend — Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key-minimum-32-chars-required
          GEMINI_API_KEY: ci-mock-key
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: ai_pulse_test
          DB_USER: root
          DB_PASSWORD: ci-test-placeholder

      - name: Publish coverage summary
        if: always()
        run: |
          echo "## 🧪 Backend Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage/coverage-summary.json 2>/dev/null | \
            node -e "
              const fs=require('fs');
              const d=JSON.parse(fs.readFileSync('/dev/stdin','utf8')).total;
              console.log('Lines:      ' + d.lines.pct + '%');
              console.log('Functions:  ' + d.functions.pct + '%');
              console.log('Branches:   ' + d.branches.pct + '%');
              console.log('Statements: ' + d.statements.pct + '%');
            " 2>/dev/null || echo "Coverage summary not available"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-${{ github.run_number }}
          path: backend/coverage/
          retention-days: 14

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 — Backend: Security Audit
  # ════════════════════════════════════════════════════════════════════════════
  backend-audit:
    name: 🔒 Backend — Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: npm audit (high + critical only)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: false

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4 — Frontend: Lint
  # ════════════════════════════════════════════════════════════════════════════
  frontend-lint:
    name: 🔍 Frontend — ESLint / ng lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: TypeScript type-check + ESLint
        run: npm run lint

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 5 — Frontend: Unit Tests + Coverage (NEW)
  # Runs Karma tests headlessly via Chrome in the CI container.
  # Coverage threshold: 60% lines/functions/branches/statements.
  # ════════════════════════════════════════════════════════════════════════════
  frontend-test:
    name: 🧪 Frontend — Karma Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Chrome (headless)
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run unit tests with coverage (headless Chrome)
        run: npm run test:ci
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Publish coverage summary
        if: always()
        run: |
          echo "## 🧪 Frontend Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage/ai-pulse-frontend/coverage-summary.json 2>/dev/null | \
            node -e "
              const fs=require('fs');
              const d=JSON.parse(fs.readFileSync('/dev/stdin','utf8')).total;
              console.log('Lines:      ' + d.lines.pct + '%');
              console.log('Functions:  ' + d.functions.pct + '%');
              console.log('Branches:   ' + d.branches.pct + '%');
              console.log('Statements: ' + d.statements.pct + '%');
            " 2>/dev/null || echo "Coverage summary not available"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-${{ github.run_number }}
          path: frontend/coverage/
          retention-days: 14

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 6 — Frontend: Production Build
  # ════════════════════════════════════════════════════════════════════════════
  frontend-build:
    name: 🏗️ Frontend — Angular Production Build
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build production bundle
        run: npm run build -- --configuration production
        env:
          CI: true

      - name: Report bundle sizes
        run: |
          echo "## 📦 Frontend Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find dist -name "*.js" -o -name "*.css" | sort | while read f; do
            size=$(du -sh "$f" | cut -f1)
            echo "$size  $f"
          done >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_number }}
          path: frontend/dist/
          retention-days: 14

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 7 — Frontend: Security Audit
  # ════════════════════════════════════════════════════════════════════════════
  frontend-audit:
    name: 🔒 Frontend — Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: npm audit (high + critical only)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true   # Angular deps frequently have low-severity advisories

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 8 — Docker: Build & Push to Docker Hub
  #
  # On pull_request  → Build only (validates the Dockerfile, no push)
  # On push to main  → Build + push to Docker Hub with tags:
  #                      <user>/ai-pulse-backend:latest
  #                      <user>/ai-pulse-backend:<git-sha>
  #                      <user>/ai-pulse-frontend:latest
  #                      <user>/ai-pulse-frontend:<git-sha>
  #
  # Required GitHub Secrets (Settings → Secrets → Actions):
  #   DOCKERHUB_USERNAME  — your Docker Hub username
  #   DOCKERHUB_TOKEN     — Docker Hub access token (NOT your password)
  # ════════════════════════════════════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker — Build & Push
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login only when pushing (i.e. on main branch, not on PRs)
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Backend image ──────────────────────────────────────────────────────
      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ai-pulse-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build & push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend image ─────────────────────────────────────────────────────
      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ai-pulse-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build & push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Hub image summary
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "## 🐳 Docker Hub Images Published" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ secrets.DOCKERHUB_USERNAME }}/ai-pulse-backend\` | \`latest\`, \`sha-${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ secrets.DOCKERHUB_USERNAME }}/ai-pulse-frontend\` | \`latest\`, \`sha-${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 9 — All CI Checks Gate (branch protection requirement)
  # ════════════════════════════════════════════════════════════════════════════
  all-checks-pass:
    name: ✅ All CI Checks Passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-lint
      - backend-test
      - backend-audit
      - frontend-lint
      - frontend-test
      - frontend-build
      - frontend-audit
      - docker-build

    steps:
      - name: Evaluate results
        run: |
          echo "## CI Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| backend-lint    | ${{ needs.backend-lint.result }}    |" >> $GITHUB_STEP_SUMMARY
          echo "| backend-test    | ${{ needs.backend-test.result }}    |" >> $GITHUB_STEP_SUMMARY
          echo "| backend-audit   | ${{ needs.backend-audit.result }}   |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend-lint   | ${{ needs.frontend-lint.result }}   |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend-test   | ${{ needs.frontend-test.result }}   |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend-build  | ${{ needs.frontend-build.result }}  |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend-audit  | ${{ needs.frontend-audit.result }}  |" >> $GITHUB_STEP_SUMMARY
          echo "| docker-build    | ${{ needs.docker-build.result }}    |" >> $GITHUB_STEP_SUMMARY

          # Hard-fail on critical jobs
          if [[ "${{ needs.backend-lint.result }}"   != "success" ||
                "${{ needs.backend-test.result }}"   != "success" ||
                "${{ needs.frontend-test.result }}"  != "success" ||
                "${{ needs.frontend-build.result }}" != "success" ||
                "${{ needs.docker-build.result }}"   != "success" ]]; then
            echo ""
            echo "❌ Critical CI job(s) failed — merge blocked." | tee -a $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo ""
          echo "✅ All critical checks passed." | tee -a $GITHUB_STEP_SUMMARY
