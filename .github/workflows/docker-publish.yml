# =============================================================================
# docker-publish.yml
# Builds backend + frontend Docker images and pushes to Docker Hub.
# Runs on every push to main — no tests required.
# =============================================================================

name: 🐳 Build & Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

jobs:
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-pulse-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-pulse-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Done
        run: |
          echo "## ✅ Images pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ secrets.DOCKERHUB_USERNAME }}/ai-pulse-backend | latest |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ secrets.DOCKERHUB_USERNAME }}/ai-pulse-frontend | latest |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Now pull on EC2: \`docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d\`" >> $GITHUB_STEP_SUMMARY
